name: Create Release

on:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            libc: musl
            binary_name: zinit-linux-x86_64-musl
          # Match the Ubuntu 26.04 / glibc 2.43 worker baseline.
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            libc: glibc
            binary_name: zinit-linux-x86_64-gnu
    env:
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}
      BINARY_NAME: ${{ matrix.binary_name }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target "$TARGET"
          rustup override set stable
          echo "version=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}

      - name: Install musl tools
        if: matrix.libc == 'musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools musl-dev binutils
          cat >> "$GITHUB_ENV" <<'ENV'
          CC=musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          RUSTFLAGS=-C target-feature=+crt-static
          ENV

      - name: Build release binary
        run: |
          # git_version! embeds the current tag; refresh it when a build is cached.
          touch src/main.rs
          cargo build --locked --release --package zinit --bin zinit --target "$TARGET"

      - name: Package binary and license
        run: |
          binary="target/$TARGET/release/zinit"
          strip "$binary"
          mkdir -p dist bundle
          install -m 0755 "$binary" "dist/$BINARY_NAME"
          install -m 0755 "$binary" bundle/zinit
          cp LICENSE bundle/LICENSE
          tar -czf "dist/$BINARY_NAME.tar.gz" -C bundle zinit LICENSE

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary_name }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zinit-*
          merge-multiple: true
          path: dist

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum zinit-* > SHA256SUMS

      - name: Publish release with all binaries and bundles
        run: |
          prerelease=false
          if [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            prerelease=true
          fi
          # A new release stays a draft until every asset has been uploaded.
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes --prerelease="$prerelease"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
